<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Facettes</title>
  <meta name="description" content="Facettes : un fil de révision du BUT informatique, fiches et petits jeux qui alternent.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#16112B">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- iPhone : l'écran d'accueil n'accepte pas le SVG, il lui faut un PNG 180×180 -->
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Facettes">
  <link rel="preload" href="polices/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="fil.css">
</head>
<body>

<header class="f-entete">
  <span class="f-marque"><svg class="f-symbole" viewBox="0 0 256 256" aria-hidden="true"><g transform="translate(-10 12)"><rect x="82" y="32" width="42" height="42" rx="10" fill="#7B4DFF"/><rect x="32" y="82" width="42" height="42" rx="10" fill="#7B4DFF"/><rect x="82" y="82" width="42" height="42" rx="10" fill="#FF5FA2"/><rect x="132" y="82" width="42" height="42" rx="10" fill="#FF6B3D"/><rect x="182" y="82" width="42" height="42" rx="10" fill="#FFC21A"/><rect x="32" y="132" width="42" height="42" rx="10" fill="#FF5FA2"/><rect x="82" y="132" width="42" height="42" rx="10" fill="#FF6B3D"/><rect x="132" y="132" width="42" height="42" rx="10" fill="#FFC21A"/><rect x="182" y="132" width="42" height="42" rx="10" fill="#00C08B"/><rect x="82" y="182" width="42" height="42" rx="10" fill="#FFC21A"/><rect x="132" y="182" width="42" height="42" rx="10" fill="#00C08B"/><rect x="132" y="32" width="42" height="42" rx="10" fill="#16112B" transform="translate(24 -24) rotate(15 153 53)"/></g></svg>Facettes</span>
  <span class="f-score cache" id="score" aria-live="polite"></span>
  <button class="f-menu" id="btn-reglages" type="button" aria-label="Réglages et progression">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16"></path>
    </svg>
  </button>
</header>

<!-- Réglages : rempli par app.js à chaque ouverture -->
<dialog class="f-reglages" id="reglages" aria-labelledby="titre-reglages">
  <div class="f-reglages-haut">
    <h2 id="titre-reglages" tabindex="-1" autofocus>Réglages</h2>
    <button class="f-option f-fermer" id="btn-fermer-reglages" type="button">Fermer</button>
  </div>
  <section>
    <h3>Matières</h3>
    <p class="f-discret">Celles qui apparaissent dans le fil.</p>
    <div class="f-pastilles" id="choix-matieres"></div>
  </section>
  <section>
    <h3>Jeux</h3>
    <p class="f-discret">Les formats de cartes à mélanger.</p>
    <div class="f-pastilles" id="choix-formats"></div>
  </section>
  <section>
    <h3>Progression</h3>
    <div class="f-progression" id="progression"></div>
  </section>
  <section>
    <h3>Remettre à zéro</h3>
    <p class="f-discret">Efface tes résultats sur cet appareil. Les réglages sont gardés.</p>
    <button class="f-option f-danger" id="btn-zero" type="button">Effacer ma progression</button>
  </section>
  <p class="f-version" id="version">Version inconnue (hors ligne ou premier lancement)</p>
</dialog>

<!-- Le fil : un écran par carte, on fait défiler verticalement (scroll-snap) -->
<main class="f-fil" id="fil" aria-label="Fil de révision">
  <section class="f-ecran"><div class="f-carte"><p>Chargement des cartes…</p></div></section>
</main>

<script src="app.js"></script>
</body>
</html>
